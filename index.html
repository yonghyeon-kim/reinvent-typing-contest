<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>디자인경영센터 REINVENT 2.0 타자 대회</title>
    <style>
        :root {
            --red: #c81743;
            --ink: #171820;
            --sub: #727583;
            --line: #e7e9ef;
            --good: #16966a
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Pretendard, "Noto Sans KR", "Malgun Gothic", sans-serif;
            color: var(--ink);
            background: radial-gradient(circle at 85% 8%, #ffe4eb 0, transparent 26%), linear-gradient(135deg, #f8f8fb, #eceef5);
            min-height: 100vh
        }

        button,
        input {
            font: inherit
        }

        .hidden {
            display: none !important
        }

        .shell,
        .game {
            width: min(1180px, calc(100% - 34px));
            margin: auto;
            padding: 28px 0 48px
        }

        .brand {
            text-align: center
        }

        .brand img {
            width: min(310px, 44vw);
            height: auto
        }

        .hero {
            margin: 48px 0 32px;
            text-align: left
        }

        .eyebrow {
            color: var(--red);
            font-weight: 800;
            letter-spacing: 1.5px;
            font-size: 14px
        }

        .hero h1 {
            font-size: clamp(38px, 6vw, 68px);
            line-height: 1.08;
            letter-spacing: -3px;
            margin: 12px 0
        }

        .hero h1 span {
            color: var(--red)
        }

        .hero p {
            color: var(--sub);
            font-size: 18px
        }

        .grid {
            display: grid;
            grid-template-columns: 1.2fr .8fr;
            gap: 24px
        }

        .card {
            background: #fffd;
            border-radius: 28px;
            padding: 28px;
            box-shadow: 0 18px 55px #25283b13
        }

        .head {
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .head h2 {
            font-size: 19px
        }

        .reset {
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 99px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 800;
            color: var(--sub)
        }

        .ranking {
            display: grid;
            gap: 9px;
            min-height: 248px
        }

        .row {
            display: grid;
            grid-template-columns: 58px 1fr auto;
            gap: 12px;
            align-items: center;
            background: #f7f7fa;
            border-radius: 16px;
            padding: 13px
        }

        .row:first-child {
            background: #fff5c7
        }

        .rank,
        .score,
        .name {
            font-weight: 900
        }

        .team {
            font-size: 12px;
            color: var(--sub)
        }

        .empty {
            display: grid;
            place-items: center;
            text-align: center;
            min-height: 215px;
            border: 2px dashed var(--line);
            border-radius: 18px;
            color: var(--sub)
        }

        .challenge {
            background: linear-gradient(145deg, #1d1e27, #08090e);
            color: #fff;
            min-height: 330px;
            display: flex;
            flex-direction: column;
            justify-content: space-between
        }

        .challenge b {
            font-size: 74px;
            color: #ff5872
        }

        .challenge p {
            color: #b4b5be;
            line-height: 1.6
        }

        .go,
        .primary {
            border: 0;
            background: var(--red);
            color: #fff;
            border-radius: 15px;
            padding: 16px;
            font-weight: 900
        }

        .go {
            width: 100%;
            font-size: 18px
        }

        .typos {
            margin-top: 24px;
            background: #171820;
            color: #fff;
            border-radius: 28px;
            padding: 27px;
            box-shadow: 0 18px 55px #25283b18
        }

        .typos h2 {
            margin: 0
        }

        .typos .desc {
            color: #aeb0bc;
            font-size: 13px;
            margin: 5px 0 18px
        }

        .typo-list {
            display: grid;
            grid-template-columns: repeat(1, minmax(0, 1fr));
            gap: 10px
        }

        .typo {
            background: #ffffff0d;
            border: 1px solid #ffffff16;
            border-radius: 16px;
            padding: 14px;
            min-width: 0
        }

        .typed {
            color: #ff7b8a;
            font-weight: 900;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .arrow,
        .by {
            color: #858994;
            font-size: 11px;
            margin-top: 6px
        }

        .answer {
            font-size: 13px;
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .typo-empty {
            grid-column: 1/-1;
            text-align: center;
            color: #90939d;
            padding: 22px;
            border: 1px dashed #ffffff22;
            border-radius: 16px
        }

        .modal {
            position: fixed;
            inset: 0;
            background: #090a10b8;
            display: grid;
            place-items: center;
            padding: 20px;
            backdrop-filter: blur(7px);
            z-index: 10
        }

        .dialog {
            width: min(470px, 100%);
            background: #fff;
            border-radius: 25px;
            padding: 28px
        }

        .field {
            margin: 14px 0
        }

        .field label {
            display: block;
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 7px
        }

        .field input {
            width: 100%;
            padding: 14px;
            border: 1.5px solid var(--line);
            border-radius: 13px
        }

        .actions {
            display: flex;
            gap: 10px
        }

        .actions button {
            flex: 1;
            border: 0;
            border-radius: 13px;
            padding: 14px;
            font-weight: 900
        }

        .ghost {
            background: #eee
        }

        .top {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: center;
            margin-bottom: 28px
        }

        .stats {
            display: flex;
            gap: 8px
        }

        .stat {
            background: #fff;
            border-radius: 14px;
            padding: 11px 14px;
            min-width: 105px;
            text-align: right
        }

        .stat small {
            display: block;
            color: var(--sub)
        }

        .stage {
            background: #fff;
            border-radius: 28px;
            padding: 45px;
            min-height: 500px;
            box-shadow: 0 18px 55px #25283b13
        }

        .bar {
            height: 7px;
            background: #eee;
            border-radius: 50px;
            overflow: hidden
        }

        .bar i {
            display: block;
            height: 100%;
            background: var(--red)
        }

        .meta {
            display: flex;
            justify-content: space-between;
            color: var(--sub);
            font-size: 13px;
            font-weight: 800;
            margin: 18px 0 55px
        }

        .sentence {
            text-align: center;
            font-size: clamp(25px, 4vw, 41px);
            font-weight: 900;
            line-height: 1.55;
            word-break: keep-all
        }

        .blank {
            display: inline-block;
            width: 100%;
            color: transparent;
            border-bottom: 4px solid var(--red);
            background: #f1f2f6;
            white-space: pre
        }

        .type {
            position: relative;
            max-width: 830px;
            margin: 34px auto 0
        }

        .type input {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 66px;
            opacity: 0
        }

        .visual {
            min-height: 66px;
            border: 2px solid var(--line);
            border-radius: 17px;
            padding: 17px 19px;
            font-size: 22px;
            font-weight: 800;
            color: var(--ink)
        }

        .caret {
            display: inline-block;
            width: 2px;
            height: 26px;
            background: var(--red);
            animation: b .7s infinite
        }

        @keyframes b {
            50% {
                opacity: 0
            }
        }

        .note {
            display: block;
            text-align: center;
            color: var(--sub);
            font-size: 12px;
            margin-top: 13px
        }

        .result {
            text-align: center
        }

        .result .big {
            font-size: 52px;
            font-weight: 950;
            color: var(--red)
        }

        .resultgrid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 20px 0
        }

        .resultgrid div {
            background: #f4f5f8;
            padding: 12px;
            border-radius: 13px
        }

        .resultgrid small {
            display: block;
            color: var(--sub)
        }

        @media(max-width:750px) {

            .grid,
            .typo-list {
                grid-template-columns: 1fr
            }

            .top {
                flex-direction: column;
                align-items: flex-start
            }

            .stats {
                overflow: auto;
                width: 100%
            }

            .stage {
                padding: 24px 17px
            }

            .hero h1 {
                letter-spacing: -2px
            }
        }
    </style>
</head>

            .settings-panel{position:absolute;top:48px;right:0;width:230px;background:#fff;border:1px solid #ececf1;border-radius:17px;padding:16px;box-shadow:0 18px 50px #17182025}
            .settings-panel label{display:block;font-size:13px;font-weight:850;margin-bottom:8px}
            .settings-panel select{width:100%;border:1.5px solid #e2e3e9;border-radius:12px;padding:11px;background:#fff;font:inherit}
            .settings-help{margin:9px 0 0;color:#777b87;font-size:11px;line-height:1.45}
            .mode-switch{position:fixed;top:20px;right:82px;z-index:49;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:#fff;border:1px solid #dfe1e8;border-radius:999px;box-shadow:0 8px 24px #25283b18}
            .mode-btn{border:0;background:transparent;color:#6f7280;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:850;cursor:pointer;white-space:nowrap}
            .mode-btn.active{background:#c81743;color:#fff}
            .practice-badge{display:inline-block;margin-left:8px;padding:3px 8px;border-radius:999px;background:#e9f7f1;color:#157b58;font-size:11px;font-weight:850}
            #ranking.ranking{min-height:0;max-height:390px;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding-right:7px;scrollbar-gutter:stable}
            #ranking.ranking::-webkit-scrollbar{width:8px} #ranking.ranking::-webkit-scrollbar-track{background:#f0f1f5;border-radius:999px} #ranking.ranking::-webkit-scrollbar-thumb{background:#c9cbd4;border-radius:999px}
            .affiliation-field select{width:100%;padding:14px;border:1.5px solid #e7e9ef;border-radius:13px;background:#fff;font:inherit;color:#171820}
            .affiliation-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
            .affiliation-group{display:grid;gap:8px;margin-bottom:0;min-width:0;padding:10px;border:1px solid #ececf1;border-radius:16px;background:#fafafd}
            .affiliation-title{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:9px 11px;border-radius:12px;background:#242630;color:#fff;font-size:13px;font-weight:900}
            .affiliation-count{color:#b9bbc4;font-size:11px;font-weight:700}
            .overall-ranking{display:grid;gap:8px;margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid #e7e9ef}
            .overall-title{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px;background:linear-gradient(135deg,#c81743,#e24667);color:#fff;font-size:13px;font-weight:900}
            .overall-title small{font-size:11px;font-weight:700;color:#ffe7ed}
            .loading{display:grid;place-items:center;min-height:180px;color:#727583;text-align:center}
            .db-error{padding:14px;border-radius:14px;background:#fff0f3;color:#a61235;font-size:13px;line-height:1.55}
            @media(max-width:750px){.mode-switch{top:12px;right:66px}.game-settings{top:12px;right:12px}.settings-btn{padding:8px 11px;font-size:12px}#ranking.ranking{max-height:365px}.affiliation-grid{grid-template-columns:1fr}}
        `;
            document.head.appendChild(extraStyle);

            function setupControls() {
                const settings = document.createElement('div');
                settings.className = 'game-settings';
                settings.innerHTML = `<button id="settingsBtn" class="settings-btn" type="button" aria-expanded="false">⚙️</button><div id="settingsPanel" class="settings-panel hidden"><label for="sentenceCountSelect">도전 문장 개수</label><select id="sentenceCountSelect">${Array.from({ length: 10 }, (_, i) => `<option value="${i + 1}">${i + 1}개</option>`).join('')}</select><p class="settings-help">10개 문장 중 선택한 개수만큼 무작위로 출제됩니다.</p></div>`;
                document.body.appendChild(settings);
                const mode = document.createElement('div');
                mode.className = 'mode-switch';
                mode.innerHTML = '<button class="mode-btn active" data-mode="challenge" type="button">도전 모드</button><button class="mode-btn" data-mode="practice" type="button">연습 모드</button>';
                document.body.appendChild(mode);
                const teamField = $('#team').closest('.field');
                teamField.querySelector('label').textContent = '팀';
                const affiliationField = document.createElement('div');
                affiliationField.className = 'field affiliation-field';
                affiliationField.innerHTML = `<label for="affiliation">소속</label><select id="affiliation" required><option value="" disabled selected>소속을 선택하세요</option>${AFFILIATIONS.map(a => `<option value="${a}">${a}</option>`).join('')}</select>`;
                teamField.parentNode.insertBefore(affiliationField, teamField);
                const select = $('#sentenceCountSelect');
                select.value = String(challengeCount);
                updateHomeCopy();
                $('#settingsBtn').onclick = event => { event.stopPropagation(); const open = $('#settingsPanel').classList.toggle('hidden') === false; $('#settingsBtn').setAttribute('aria-expanded', String(open)); };
                $('#settingsPanel').onclick = event => event.stopPropagation();
                document.addEventListener('click', () => { $('#settingsPanel').classList.add('hidden'); $('#settingsBtn').setAttribute('aria-expanded', 'false'); });
                select.onchange = () => { challengeCount = Number(select.value); try { window.localStorage.setItem('reinventChallengeCount', String(challengeCount)); } catch (error) { console.info('샌드박스 환경에서는 설정을 저장하지 않습니다.'); } updateHomeCopy(); };
                mode.onclick = event => { const button = event.target.closest('.mode-btn'); if (!button) return; selectedMode = button.dataset.mode; paintMode(); };
            }

            function paintMode() {
                document.querySelectorAll('.mode-btn').forEach(button => button.classList.toggle('active', button.dataset.mode === selectedMode));
                $('#challenge').textContent = selectedMode === 'practice' ? '연습 시작하기 →' : '도전 시작하기 →';
            }
            function updateHomeCopy() {
                $('.challenge b').textContent = challengeCount;
                $('.challenge p').innerHTML = `10개 문장 중 ${challengeCount}개가 무작위로 출제됩니다.<br>문장 뒷부분의 빈칸을 완성해 보세요.`;
            }
            function question(text) {
                const target = text.length - Math.ceil(text.length * .5);
                let start = text.indexOf(' ', target);
                start = start < 0 ? ((text.lastIndexOf(' ', target) + 1) || target) : start + 1;
                return { text, start, answer: text.slice(start) };
            }
            function editDistance(a, b) {
                const d = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
                for (let i = 0; i <= a.length; i++) d[i][0] = i;
                for (let j = 0; j <= b.length; j++) d[0][j] = j;
                for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
                return d[a.length][b.length];
            }
            function funnyTypoScore(wrong, right) {
                const diff = editDistance(wrong, right);
                const lengthGap = Math.abs(wrong.length - right.length);
                let score = 0;
                // 정답과 너무 비슷한 단순 오타보다 변화가 있는 문장에 점수
                score += Math.min(diff, 10) * 2;
                // 너무 짧게 입력하거나 입력하지 않은 오답은 제외
                if (!wrong || wrong === '(입력 없음)') {
                    return -100;
                }
                // 문장이 지나치게 짧아진 경우 감점
                if (wrong.length < right.length * 0.5) {
                    score -= 15;
                }
                // 원문보다 지나치게 길어진 경우 감점
                if (wrong.length > right.length * 1.8) {
                    score -= 10;
                }
                // 길이 차이가 너무 크면 무작위 입력일 가능성이 있어 감점
                score -= Math.max(0, lengthGap - 5);
                // 반복 문자나 키보드 난타 형태 감점
                if (/(.)\1{3,}/.test(wrong)) {
                    score -= 15;
                }
                // 자음이나 모음만 이어지는 입력 감점
                if (/[ㄱ-ㅎㅏ-ㅣ]{4,}/.test(wrong)) {
                    score -= 15;
                }
                return score;
            }
            function stats() {
                const sec = Math.max(.1, (performance.now() - st.start) / 1000);
                const tpm = Math.round(st.submittedChars / sec * 60);
                const acc = st.expectedChars ? Math.max(0, (st.expectedChars - st.errors) / st.expectedChars * 100) : 100;
                return { sec, tpm, acc };
            }
            function update() {
                const x = stats(); $('#tpm').textContent = x.tpm; $('#acc').textContent = Math.round(x.acc);
                $('#timer').textContent = `${String(Math.floor(x.sec / 60)).padStart(2, '0')}:${String(Math.floor(x.sec % 60)).padStart(2, '0')}.${Math.floor(x.sec % 1 * 10)}`;
            }
            function showQuestion() {
                const q = st.q[st.i]; $('#qno').textContent = `QUESTION ${st.i + 1} / ${st.q.length}`; $('#prog').style.width = ((st.i + 1) / st.q.length * 100) + '%';
                $('#sentence').innerHTML = st.mode === 'practice' ? esc(q.answer) : esc(q.text.slice(0, q.start)) + `<span class="blank" style="width:${Math.max(100, q.answer.length)}%">${esc(q.answer)}</span>`;
                $('#typing').value = ''; $('#visual').innerHTML = '<span class="caret"></span>';
            }
            function startGame(mode) {
                pendingWrites = [];
                if (mode === 'practice') st = { mode, team: '연습 모드', name: '연습자', q: PRACTICE_SENTENCES.map(text => ({ text, start: 0, answer: text })), i: 0, start: performance.now(), expectedChars: 0, errors: 0, submittedChars: 0, done: false, lock: false };
                else {
                    const affiliation = $('#affiliation').value, team = $('#team').value.trim(), name = $('#name').value.trim();
                    if (!affiliation || !team || !name) { alert('소속, 팀, 이름을 모두 입력해 주세요.'); return; }
                    st = { mode, affiliation, team, name, q: [...S].sort(() => Math.random() - .5).slice(0, challengeCount).map(question), i: 0, start: performance.now(), expectedChars: 0, errors: 0, submittedChars: 0, done: false, lock: false };
                }
                $('#pname').innerHTML = mode === 'practice' ? '연습 모드 <span class="practice-badge">기록 미저장</span>' : esc(st.name);
                $('#pteam').textContent = mode === 'practice' ? '소속과 이름 입력 없이 바로 연습합니다.' : `${st.affiliation} · ${st.team}`;
                $('#startModal').classList.add('hidden'); $('#home').classList.add('hidden'); $('#game').classList.remove('hidden');
                showQuestion(); clearInterval(tick); tick = setInterval(update, 100); $('#typing').focus();
            }

            async function fetchRanks() {
                return await api('/typing_rank?select=id,name,affiliation,team,score,time,created_at&order=score.desc,time.asc&limit=500') || [];
            }
            async function renderRanks() {
                const board = $('#ranking'); board.innerHTML = '<div class="loading">공유 랭킹을 불러오는 중입니다.</div>';
                try {
                    const list = (await fetchRanks()).filter(r => Number.isFinite(Number(r.score)));
                    if (!list.length) { board.innerHTML = '<div class="empty">아직 기록이 없습니다.<br>첫 번째 챔피언이 되어보세요!</div>'; return; }
                    const top = list.slice(0, 3);
                    const groups = AFFILIATIONS.map(affiliation => ({ affiliation, items: list.filter(r => r.affiliation === affiliation) })).filter(g => g.items.length);
                    const legacy = list.filter(r => !AFFILIATIONS.includes(r.affiliation)); if (legacy.length) groups.push({ affiliation: '기존 기록', items: legacy });
                    const row = (r, i, overall = false) => `<div class="row"><div class="rank">${['🥇 1위', '🥈 2위', '🥉 3위'][i] || `${i + 1}위`}</div><div><div class="name">${esc(r.name)}</div><div class="team">${overall ? esc((r.affiliation || '기존 기록') + ' · ') : ''}${esc(r.team)}</div></div><div class="score">${Number(r.score).toLocaleString()}점</div></div>`;
                    board.innerHTML = `<section class="overall-ranking"><div class="overall-title"><span>🏆 전체 TOP 3</span><small>전체 도전자 기준</small></div>${top.map((r, i) => row(r, i, true)).join('')}</section><div class="affiliation-grid">${groups.map(g => `<section class="affiliation-group"><div class="affiliation-title"><span>${esc(g.affiliation)}</span><span class="affiliation-count">${g.items.length}명</span></div>${g.items.map((r, i) => row(r, i)).join('')}</section>`).join('')}</div>`;
                } catch (error) {
                    console.error(error); board.innerHTML = `<div class="db-error"><b>Supabase 연결 또는 테이블 설정을 확인해 주세요.</b><br>${esc(error.message || error)}</div>`;
                }
            }
            async function saveTypo(wrong, right) {
                if (wrong === right || st.mode === 'practice') return;
                const task = api('/typing_typos', {
                    method: 'POST',
                    headers: { Prefer: 'return=minimal' },
                    body: JSON.stringify({ wrong_text: wrong || '(입력 없음)', right_text: right, name: st.name, affiliation: st.affiliation, team: st.team })
                });
                pendingWrites.push(task); await task;
            }
            async function renderTypos() {
                try {
                    const rawList = await api(
                    '/typing_typos?select=wrong_text,right_text,name,affiliation,team,created_at&order=created_at.desc&limit=100'
                ) || [];
                 
                const list = rawList
                    .map((item, index) => ({
                    ...item,
                    funScore:
                    funnyTypoScore(item.wrong_text, item.right_text)
                    + Math.max(0, 10 - index * 0.1)
                    }))
                    .filter(item => item.funScore > -50)
                    .sort((a, b) => {
                    // 재미 점수가 높은 오답 우선
                    if (b.funScore !== a.funScore) {
                        return b.funScore - a.funScore;
                    }
                     
                    // 재미 점수가 같으면 먼저 등록된 오답 우선
                    return new Date(a.created_at) - new Date(b.created_at);
                    })
                    .slice(0, 6);
                 
                $('#typoList').innerHTML = list.length
                ? list.map(x => `
                <div class="typo">
                <div class="typed">
                “${esc(x.wrong_text)}”
                </div>
                <div class="by">
                ${esc(
                x.affiliation
                ? x.affiliation + ' · '
                : ''
                )}
                ${esc(x.team)} · ${esc(x.name)}
                </div>
                </div>
                `).join('')
                : `
                <div class="typo-empty">
                아직 오타가 없습니다.
                첫 번째 명작을 남겨보세요!
                </div>
                `;
                } catch (error) {
                console.error(error);
                 
                $('#typoList').innerHTML = `
                <div class="typo-empty">
                오답 기록을 불러오지 못했습니다.
                </div>
                `;
                }
            }
            async function finishChallenge() {
                if (st.done) return; st.done = true; clearInterval(tick); const x = stats();
                const score = Math.max(0, Math.round(x.tpm * 10 * Math.pow(x.acc / 100, 2) + Math.max(0, 3000 - Math.round(x.sec) * 25)));
                try {
                    await Promise.allSettled(pendingWrites);
                    const inserted = await api('/typing_rank', {
                        method: 'POST',
                        headers: { Prefer: 'return=representation' },
                        body: JSON.stringify({ name: st.name, affiliation: st.affiliation, team: st.team, score, time: Number(x.sec.toFixed(3)) })
                    });
                    const data = Array.isArray(inserted) ? inserted[0] : inserted;
                    if (!data || data.id == null) throw new Error('저장 결과에서 기록 ID를 받지 못했습니다.');
                    const list = await fetchRanks(); const rank = list.findIndex(r => String(r.id) === String(data.id)) + 1;
                    $('#identity').textContent = `${st.affiliation} · ${st.team} ${st.name}`; $('#rscore').textContent = score.toLocaleString() + '점'; $('#rrank').textContent = rank || '-';
                    $('#rtpm').textContent = x.tpm + ' TPM'; $('#rtime').textContent = x.sec.toFixed(1) + '초'; $('#racc').textContent = x.acc.toFixed(1) + '%';
                    $('#resultModal').classList.remove('hidden'); await Promise.all([renderRanks(), renderTypos()]);
                } catch (error) {
                    st.done = false; console.error(error); alert('기록 저장에 실패했습니다. Supabase 테이블과 RLS 정책을 확인한 뒤 다시 시도해 주세요.\n\n' + (error.message || error));
                }
            }
            function finishPractice() {
                if (st.done) return; st.done = true; clearInterval(tick); const x = stats();
                const score = Math.max(0, Math.round(x.tpm * 10 * Math.pow(x.acc / 100, 3) + Math.max(0, 2500 - Math.round(x.sec) * 20) + x.acc * 10));
                $('#identity').textContent = '연습 모드'; $('#rscore').textContent = score.toLocaleString() + '점'; $('#rrank').parentElement.innerHTML = '연습 결과 · 랭킹에 저장되지 않음';
                $('#rtpm').textContent = x.tpm + ' TPM'; $('#rtime').textContent = x.sec.toFixed(1) + '초'; $('#racc').textContent = x.acc.toFixed(1) + '%'; $('#resultModal').classList.remove('hidden');
            }
            function resetResultTitle() { const h = $('#rscore').nextElementSibling; if (h) h.innerHTML = '최종 순위<span id="rrank"></span>';}
            function scheduleRefresh() { clearTimeout(refreshTimer); refreshTimer = setTimeout(() => Promise.all([renderRanks(), renderTypos()]), 250); }

            setupControls(); paintMode();
            $('#challenge').onclick = () => selectedMode === 'practice' ? startGame('practice') : $('#startModal').classList.remove('hidden');
            $('#cancel').onclick = () => $('#startModal').classList.add('hidden');
            $('#start').onclick = () => startGame('challenge');
            $('#typing').oninput = event => { $('#visual').textContent = event.target.value; const caret = document.createElement('span'); caret.className = 'caret'; $('#visual').appendChild(caret); };
            $('#typing').onkeydown = event => {
                if (event.key !== 'Enter' || st.lock || st.done) return; event.preventDefault(); const q = st.q[st.i], value = event.target.value, diff = editDistance(value, q.answer);
                st.expectedChars += q.answer.length; st.errors += diff; st.submittedChars += value.length; 
                if (diff > 0 && st.mode !== 'practice') {saveTypo(q.text.slice(0, q.start) + value, q.text).catch(console.error);}
                update(); st.lock = true;
                setTimeout(() => { if (st.i === st.q.length - 1) { st.mode === 'practice' ? finishPractice() : finishChallenge(); } else { st.i++; st.lock = false; showQuestion(); $('#typing').focus(); } }, 150);
            };
            $('#homeBtn').onclick = () => { $('#resultModal').classList.add('hidden'); $('#game').classList.add('hidden'); $('#home').classList.remove('hidden'); resetResultTitle(); selectedMode = 'challenge'; paintMode(); scheduleRefresh(); };
            $('#reset').onclick = async () => {
                const first = confirm('공유 랭킹과 오답 기록을 모든 기기에서 삭제합니다. 계속할까요?'); if (!first) return;
                const typed = prompt('실수 방지를 위해 RESET을 입력해 주세요.'); if (typed !== 'RESET') { alert('취소되었습니다.'); return; }
                try {
                    await Promise.all([
                        api('/typing_rank?id=gte.0', { method: 'DELETE', headers: { Prefer: 'return=minimal' } }),
                        api('/typing_typos?id=gte.0', { method: 'DELETE', headers: { Prefer: 'return=minimal' } })
                    ]);
                } catch (error) { console.error(error); alert('삭제 권한이 없습니다. Supabase의 DELETE 정책을 확인해 주세요.\n\n' + error.message); return; }
                await Promise.all([renderRanks(), renderTypos()]);
            };
            window.addEventListener('pageshow', scheduleRefresh);
            document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') scheduleRefresh(); });
            renderRanks(); renderTypos();
        })();
    </script>
